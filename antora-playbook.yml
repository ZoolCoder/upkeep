# Build the docs site:
#   npx antora antora-playbook.yml && open build/site/index.html
site:
  title: upkeep
  start_page: upkeep::index.adoc
  # Absolute, so the sitemap and any canonical link point at the published site
  # rather than at whatever host happened to build it.
  url: https://zoolcoder.github.io/upkeep
content:
  sources:
    - url: .
      start_path: docs
      branches: HEAD
ui:
  # The studio identity, applied over the default UI rather than forked from
  # it: an upstream fix keeps arriving, and a fork stops receiving them.
  supplemental_files: ./docs/supplemental-ui
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
