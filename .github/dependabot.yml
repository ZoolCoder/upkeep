version: 2
updates:
  # The actions are the supply chain that runs with repository permissions, so
  # they are the ones worth watching most closely.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }

  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "deps" }
